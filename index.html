<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inbuilt — AI · Software · Data</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.441.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Main Navigation -->
  <header class="sticky top-0 z-50 bg-white/90 backdrop-blur border-b border-[var(--line)]">
    <div class="max-w-7xl mx-auto px-5 h-14 flex items-center justify-between gap-6">
      <a href="#/" id="brand" aria-label="Inbuilt home"></a>
      <nav class="hidden lg:flex items-center gap-7" aria-label="Primary" id="nav"></nav>
      <div class="flex items-center gap-3">
        <button class="grid place-items-center w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 transition" aria-label="Search">
          <i data-lucide="search" class="w-4 h-4"></i>
        </button>
        <a href="#/validate" id="hdr-cta" class="btn btn-primary hidden sm:inline-flex !py-2">Start a Project</a>
        <button id="menu-btn" class="lg:hidden p-2" aria-label="Menu">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
    <nav id="mobile-nav" class="hidden lg:hidden border-t border-[var(--line)] px-5 py-3 flex-col gap-3" aria-label="Mobile"></nav>
  </header>

  <main id="app"></main>

  <!-- Footer -->
  <footer class="border-t border-[var(--line)] bg-white" id="footer"></footer>

  <script>
    const $ = (s, r = document) => r.querySelector(s);
    const ic = (n, c = '') => `<i data-lucide="${n}" class="${c}"></i>`;
    const tile = (t, n, c = '') => `<span class="ico t-${t} ${c}">${ic(n)}</span>`;
    const arrow = ic('arrow-right', 'w-3.5 h-3.5');
    const btn = (l, h, k = 'primary', x = '') => `<a href="${h}" class="btn btn-${k} ${x}">${l} ${arrow}</a>`;
    const checks = (a, c = 'text-emerald-500') => a.map(x => `<li class="flex items-start gap-2">${ic('check-circle-2', 'w-4 h-4 shrink-0 mt-0.5 ' + c)}<span>${x}</span></li>`).join('');
    const sec = (t, s, link, h) => `
      <div class="flex items-end justify-between gap-4 mb-5">
        <div>
          <h2 class="text-2xl font-extrabold tracking-tight">${t}</h2>
          <p class="text-sm text-[var(--muted)] mt-1">${s}</p>
        </div>
        ${link ? `<a href="${h || '#/'}" class="text-xs font-bold text-blue-700 hover:underline inline-flex items-center gap-1 shrink-0">${link} ${arrow}</a>` : ''}
      </div>`;
    const wrap = x => `<div class="max-w-7xl mx-auto px-5">${x}</div>`;
    const crumb = t => `
      <div class="text-xs text-slate-600 mb-4">
        <a href="#/" class="hover:text-[var(--primary)]">Home</a> <span class="mx-2">›</span> ${t}
      </div>`;
    const tcol = ['blue', 'green', 'cyan', 'violet', 'pink', 'orange'];
    const ctaBtns = (a, b, ha = '#/validate', hb = '#/services') => `
      <div class="flex flex-wrap gap-3">
        ${btn(a, ha)}
        ${btn(b, hb, 'light')}
      </div>`;
    const tick = a => `
      <ul class="flex flex-wrap gap-x-6 gap-y-2 mt-6 text-xs text-slate-600">
        ${a.map(x => `<li class="flex items-center gap-1.5">${ic('check', 'w-3.5 h-3.5 text-emerald-500')}${x}</li>`).join('')}
      </ul>`;

    const steps = (list, cols) => `
      <ol class="grid gap-4 sm:grid-cols-2 lg:grid-cols-${cols}">
        ${list.map((s, i) => `
          <li class="relative">
            <div class="flex items-center gap-2">
              <span class="num t-${s[3]}">${String(i + 1).padStart(2, '0')}</span>
              ${i < list.length - 1 ? '<span class="hidden lg:block flex-1 border-t border-dashed border-slate-300"></span>' : ''}
            </div>
            <h3 class="font-bold text-sm mt-3">${s[0]}</h3>
            <p class="text-xs text-[var(--muted)] mt-1 leading-relaxed">${s[1]}</p>
          </li>
        `).join('')}
      </ol>`;

    const ctaBand = (eyebrow, h, p, stats, bg = 'cta-band') => `
      <section class="${bg} text-white rounded-2xl mx-5 max-w-7xl xl:mx-auto overflow-hidden my-12">
        <div class="p-8 md:p-10 grid gap-8 lg:grid-cols-[1.2fr_1fr] items-center">
          <div>
            <span class="eyebrow !bg-white/10 !border-white/20 !text-white">${eyebrow}</span>
            <h2 class="text-2xl md:text-3xl font-extrabold mt-3">${h}</h2>
            <p class="text-sm text-white/80 mt-2 mb-6">${p}</p>
            ${ctaBtns('Validate an Idea', 'Start a Project', '#/validate', '#/services')}
          </div>
          ${stats ? `
            <div class="grid grid-cols-4 gap-2 text-center">
              ${stats.map(s => `
                <div class="glass py-4">
                  <div class="text-xl font-extrabold">${s[0]}</div>
                  <div class="text-[10px] text-white/70 mt-1">${s[1]}</div>
                </div>
              `).join('')}
            </div>
          ` : ''}
        </div>
      </section>`;

    const form = (o) => `
      <form class="rounded-2xl bg-[var(--soft)] border border-[var(--line)] p-6" onsubmit="return submitForm(event)">
        <div class="flex justify-between items-center">
          <span class="eyebrow">${ic('target', 'w-3 h-3')} Get Started</span>
          ${o.step ? '<span class="chip bg-white border border-[var(--line)]">STEP 1 OF 3</span>' : ''}
        </div>
        <h2 class="text-2xl font-extrabold mt-3">${o.title}</h2>
        <p class="text-sm text-[var(--muted)] mt-1 mb-5">${o.sub}</p>
        
        <label class="block text-xs font-bold mb-1" for="${o.id}-t">Idea Title <span class="text-red-500">*</span></label>
        <input id="${o.id}-t" class="field mb-4" placeholder="e.g. AI tool for automating insurance claims" required>
        
        <label class="block text-xs font-bold mb-1" for="${o.id}-d">Description <span class="text-red-500">*</span></label>
        <div class="relative mb-4">
          <textarea id="${o.id}-d" rows="4" maxlength="1000" class="field resize-none" placeholder="${o.ph}" required oninput="this.nextElementSibling.textContent=this.value.length+'/1000'"></textarea>
          <span class="absolute bottom-2 right-3 text-[10px] text-slate-400">0/1000</span>
        </div>
        
        <div class="grid grid-cols-2 gap-3 mb-4">
          <div>
            <label class="block text-xs font-bold mb-1" for="${o.id}-i">Target Industry</label>
            <select id="${o.id}-i" class="field">
              <option>Select industry</option>
              <option>Healthcare</option>
              <option>Insurance</option>
              <option>Technology &amp; SaaS</option>
              <option>Professional Services</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold mb-1" for="${o.id}-m">${o.last}</label>
            <select id="${o.id}-m" class="field">
              <option>${o.lastPh}</option>
              <option>B2B</option>
              <option>B2C</option>
              <option>Enterprise</option>
            </select>
          </div>
        </div>
        
        <button class="btn btn-primary btn-block">${o.btn} ${arrow}</button>
      </form>`;

    const views = {};

    views.home = () => `
      <section class="hero-dark text-white">
        <div class="max-w-7xl mx-auto px-5 py-14 grid gap-10 lg:grid-cols-[1fr_1.1fr] items-center">
          <div>
            <span class="eyebrow !bg-white/10 !border-white/20 !text-white normal-case !tracking-normal">
              ${ic('zap', 'w-3 h-3')} From Idea to Intelligence to Product
            </span>
            <h1 class="text-4xl md:text-5xl font-extrabold leading-[1.1] mt-5">
              Turn Business Ideas and Problems into <span class="grad-text-light">Working AI Solutions</span>
            </h1>
            <p class="text-sm text-white/80 mt-5 max-w-md leading-relaxed">
              Validate with DataThick intelligence. Design, build and deploy with Inbuilt. From AI agents and automation to enterprise software and data platforms.
            </p>
            <div class="flex flex-wrap gap-3 mt-7">
              ${btn('Validate an Idea', '#/validate')}
              ${btn('Build an MVP', '#/mvp', 'light')}
            </div>
            <ul class="flex flex-wrap gap-x-6 gap-y-2 mt-7 text-xs text-white/80">
              ${['Business-first approach', 'Enterprise-ready solutions', 'End-to-end from idea to scale'].map(x => `<li class="flex items-center gap-1.5">${ic('check', 'w-3.5 h-3.5')}${x}</li>`).join('')}
            </ul>
          </div>
          <div class="relative">
            <div class="hidden md:flex flex-wrap gap-2 justify-end mb-4">
              ${['AI Agents', 'Automation', 'Enterprise Software', 'Data &amp; Analytics'].map(x => `<span class="glass text-[10px] font-semibold px-3 py-1.5">${x}</span>`).join('')}
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 items-center">
              ${[['lightbulb', 'Your Idea or Problem'], ['bar-chart-3', 'Validate with DataThick Intelligence'], ['code-2', 'Build with Inbuilt'], ['rocket', 'Launch &amp; Scale']].map((s, i) => `
                <div class="glass ${i == 2 ? 'on scale-105' : ''} p-4 text-center min-h-[120px] flex flex-col items-center justify-center gap-2">
                  ${ic(s[0], 'w-6 h-6')}
                  <span class="text-[11px] font-semibold leading-tight">${s[1]}</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      </section>

      <section class="py-8 border-b border-[var(--line)]">
        ${wrap(`
          <p class="text-[10px] uppercase tracking-wider text-slate-500 mb-4">Technologies We Work With</p>
          <div class="flex flex-wrap items-center justify-between gap-x-8 gap-y-4 text-slate-800 font-bold">
            ${['aws', 'Microsoft', 'Google Cloud', 'OpenAI', 'ANTHROPIC', 'MongoDB', 'PostgreSQL', 'docker', 'kubernetes'].map(x => `<span class="text-sm opacity-80 hover:opacity-100 transition">${x}</span>`).join('')}
          </div>
        `)}
      </section>

      <section class="py-12">
        ${wrap(`
          <span class="eyebrow">What brings you here?</span>
          <div class="flex flex-wrap justify-between items-start gap-4 mt-2 mb-6">
            <h2 class="text-3xl font-extrabold">How can we help you?</h2>
            <p class="text-sm italic text-indigo-600 text-right leading-snug" style="font-family:cursive">Different starting points.<br>Same destination.<br>Real business impact.</p>
          </div>
          <div class="grid gap-5 md:grid-cols-3">
            ${[['blue', 'target', 'I have a business problem', 'Explore how AI and automation can solve your business challenges.', 'Get an AI Opportunity Assessment', '#/services', 'bg-blue-50/60 text-blue-600'], ['violet', 'lightbulb', 'I have a product idea', 'Validate the opportunity and build a working MVP.', 'Idea Validation &amp; MVP', '#/validate', 'bg-violet-50/60 text-violet-600'], ['green', 'settings', 'I know what I want built', 'Turn your requirements into a production-ready solution.', 'Start an AI/Software Project', '#/mvp', 'bg-emerald-50/60 text-emerald-600']].map(c => `
              <a href="${c[5]}" class="card hover p-6 ${c[6].split(' ')[0]} block">
                ${tile(c[0], c[1])}
                <h3 class="font-bold text-lg mt-4">${c[2]}</h3>
                <p class="text-sm text-[var(--muted)] mt-1 mb-5">${c[3]}</p>
                <span class="btn btn-outline ${c[0] == 'green' ? '!text-emerald-600 !border-emerald-300' : c[0] == 'violet' ? '!text-violet-600 !border-violet-300' : ''} text-[11px]">${c[4]} ${arrow}</span>
              </a>
            `).join('')}
          </div>
        `)}
      </section>

      <section class="bg-[var(--soft)] py-12">
        ${wrap(`
          <div class="grid gap-8 lg:grid-cols-2 items-center">
            <div>
              <span class="eyebrow">${ic('database', 'w-3 h-3')} Powered by DataThick</span>
              <h2 class="text-4xl font-extrabold mt-4">Validate Before <span class="text-blue-600">You Build</span></h2>
              <p class="text-sm text-[var(--muted)] mt-4 max-w-md leading-relaxed">Not every idea deserves an MVP. Use DataThick intelligence to investigate market demand, competition, technology signals and customer needs before investing in development.</p>
              <div class="flex gap-3 mt-6">
                ${btn('Explore DataThick', '#/validate', 'dark')}
                ${btn('See a Sample Report', '#/validate', 'light')}
              </div>
              <div class="grid grid-cols-3 sm:grid-cols-6 gap-3 mt-8 text-center">
                ${[['trending-up', 'Market Analysis', 'blue'], ['swords', 'Competitive Landscape', 'red'], ['users', 'Customer Signals', 'blue'], ['cpu', 'Technology Trends', 'green'], ['sparkles', 'AI Opportunity', 'cyan'], ['file-text', 'MVP Recommendation', 'violet']].map(x => `
                  <div class="text-[10px] text-slate-600 leading-tight">
                    ${tile(x[2], x[0], '!w-9 !h-9 mb-1')}
                    <br>${x[1]}
                  </div>
                `).join('')}
              </div>
            </div>
            <div class="card p-4 grid sm:grid-cols-[150px_1fr] gap-4">
              <div class="sm:col-span-2 flex justify-between text-xs font-bold">
                <span>Opportunity Intelligence Report</span>
                <span class="chip bg-violet-100 text-violet-700">AI-Powered Analysis</span>
              </div>
              <ul class="text-[11px] space-y-1">
                ${['Executive Summary', 'Market Analysis', 'Competitive Landscape', 'Customer Insights', 'Technology Analysis', 'AI Opportunity', 'MVP Recommendation'].map((x, i) => `
                  <li class="px-2 py-1.5 rounded ${i == 0 ? 'bg-blue-50 text-blue-700 font-bold' : 'text-slate-600'}">${x}</li>
                `).join('')}
              </ul>
              <div>
                <div class="flex justify-between">
                  <div>
                    <div class="text-[10px] text-slate-500">Market Opportunity</div>
                    <div class="flex items-end gap-1 h-16 mt-2">
                      ${[20, 28, 36, 44, 54, 66].map(h => `<div class="bar w-4" style="height:${h}px"></div>`).join('')}
                    </div>
                  </div>
                  <div class="text-right">
                    <div class="text-xl font-extrabold">$12.5B</div>
                    <div class="text-[9px] text-slate-500">Est. Market Size</div>
                    <div class="text-emerald-600 font-bold text-sm mt-1">↑ 18%</div>
                    <div class="text-[9px] text-slate-500">CAGR (2023–2030)</div>
                  </div>
                </div>
                <div class="text-[11px] font-bold mt-3 mb-1">Key Insights</div>
                <ul class="text-[10px] space-y-1 text-slate-600">
                  ${checks(['Strong market demand', 'Growing AI adoption', 'Medium competition', 'High differentiation opportunity'])}
                </ul>
              </div>
            </div>
          </div>
        `)}
      </section>

      <section class="py-12">
        ${wrap(`
          ${sec('What We Build', 'End-to-end AI, software and data solutions to solve real business problems.', 'Explore All Solutions', '#/services')}
          <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-6">
            ${[['blue', 'file-text', 'AI Document Intelligence', 'Extract data, understand content and automate workflows.'], ['green', 'workflow', 'AI Workflow Automation', 'Automate repetitive business processes across systems.'], ['cyan', 'share-2', 'AI Agents', 'Agents that execute bounded business tasks with your data and tools.'], ['violet', 'shield-check', 'Enterprise Knowledge AI', 'Turn internal knowledge into trusted answers.'], ['pink', 'user-cog', 'AI Copilots', 'AI inside your employee workflows and applications.'], ['orange', 'bar-chart-3', 'AI Analytics', 'From data to insights and actions.']].map(c => `
              <a href="#/services" class="card hover p-4 block">
                ${tile(c[0], c[1])}
                <h3 class="font-bold text-sm mt-3 leading-tight">${c[2]}</h3>
                <p class="text-xs text-[var(--muted)] mt-1 mb-3">${c[3]}</p>
                <span class="text-blue-700">${arrow}</span>
              </a>
            `).join('')}
          </div>
        `)}
      </section>

      <section class="py-8">
        ${wrap(`
          ${sec('From Idea to Production', 'A proven, end-to-end process to take your idea from concept to a scalable AI product.', 'Learn About Our Process', '#/mvp')}
          ${steps([['Validate', 'Market, customer, competition and technology validation with DataThick.', '', 'blue'], ['Design', 'MVP, UX/UI and architecture.', '', 'violet'], ['Build', 'Working product with AI integration.', '', 'green'], ['Launch', 'Pilot, production deployment.', '', 'orange'], ['Scale', 'AI operations, continuous improvement and productization.', '', 'blue']], 5)}
        `)}
      </section>

      <section class="py-10 bg-[var(--soft)]">
        ${wrap(`
          <div class="grid gap-6 lg:grid-cols-[1.1fr_.9fr_.8fr]">
            <div>
              <h2 class="text-2xl font-extrabold">Have a Product Idea?</h2>
              <p class="text-sm text-[var(--muted)] mt-2 mb-4 leading-relaxed">You don't need a large engineering team to validate and build your idea. We help you turn a business concept into a working MVP and beyond.</p>
              <ul class="grid grid-cols-2 gap-2 text-xs mb-5">
                ${checks(['Idea validation with DataThick', 'AI integration', 'Product strategy &amp; UX/UI', 'MVP development', 'Scalable architecture', 'Pilot and production support'], 'text-blue-600')}               </ul>${btn('Build My MVP', '#/mvp')}
            </div>
            <div class="card p-4">
              <div class="flex justify-between text-xs font-bold">
                <span>Your Idea</span>
                <span class="chip bg-violet-100 text-violet-700">Description</span>
              </div>
              <div class="field mt-3 text-slate-400">Describe your idea...</div>
              <div class="flex flex-wrap gap-1.5 my-3">
                ${['AI for healthcare claims', 'Document processing', 'Internal knowledge assistant', 'Research intelligence'].map(x => `<span class="chip bg-slate-100 text-slate-600">${x}</span>`).join('')}
              </div>
              <a href="#/validate" class="btn btn-primary btn-block">Generate Opportunity Analysis</a>
            </div>
            <div class="cta-band text-white rounded-2xl p-6">
              <div class="flex justify-between">
                <h3 class="font-bold text-sm">For Startups &amp; Founders</h3>
                <span class="chip bg-white/15">SPECIAL SUPPORT</span>
              </div>
              <ul class="text-xs space-y-2 my-4 text-white/90">
                ${checks(['Fast MVP development', 'Cost-effective approach', 'Access to AI expertise', 'From concept to market', 'Ongoing product support'], 'text-sky-300')}
              </ul>
              <a href="#/services" class="btn btn-light btn-block">Let's Discuss Your Idea</a>
            </div>
          </div>
        `)}
      </section>

      <section class="py-12">
        ${wrap(`
          ${sec('Industries We Focus On', 'Domain expertise combined with AI and engineering capabilities.', 'View All Industries', '#/services')}
          <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
            ${[['Healthcare', 'stethoscope', 'AI automation, document intelligence and data platforms.', 'photo-1576091160399-112ba8d25d1d', 'blue'], ['Insurance', 'shield-check', 'Claims, underwriting, compliance and automation.', 'photo-1450101499163-c8848c66ca85', 'green'], ['Technology &amp; SaaS', 'layers', 'Product engineering, AI features and data platforms.', 'photo-1518770660439-4636190af475', 'cyan'], ['Professional Services', 'briefcase', 'AI automation for legal, finance, consulting and more.', 'photo-1556761175-5973dc0f32e7', 'orange']].map(c => `
              <a href="#/services" class="card hover overflow-hidden block">
                <div class="h-36 bg-cover bg-center relative" style="background-image:linear-gradient(180deg,transparent 30%,rgba(10,18,53,.85)),url('https://images.unsplash.com/${c[3]}?auto=format&fit=crop&w=600&q=70')">
                  <div class="absolute bottom-3 left-3 flex items-center gap-2 text-white font-bold text-sm">
                    ${tile(c[4], c[1], '!w-8 !h-8')}
                    ${c[0]}
                  </div>
                </div>
                <div class="p-3">
                  <p class="text-xs text-[var(--muted)]">${c[2]}</p>
                  <span class="text-xs font-bold text-blue-700 mt-2 inline-flex items-center gap-1">Learn More ${arrow}</span>
                </div>
              </a>
            `).join('')}
          </div>
        `)}
      </section>

      <section class="py-8">
        ${wrap(`
          ${sec('Why Companies Work with Inbuilt', 'We combine business understanding, engineering depth and AI expertise to deliver real outcomes.')}
          <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-5">
            ${[['red', 'heart', 'Business-first', 'We start with the problem, not the model.'], ['blue', 'settings', 'Engineering depth', 'We build production software, not AI demos.'], ['green', 'sparkles', 'AI-native', 'Agents, RAG, automation, analytics and modern architecture.'], ['blue', 'shield', 'Enterprise-ready', 'Security, governance and observability.'], ['orange', 'trophy', 'Product mindset', 'We identify reusable capabilities that can evolve into products.']].map(c => `
              <div class="card p-4 flex gap-3">
                ${tile(c[0], c[1], 'shrink-0')}
                <div>
                  <h3 class="font-bold text-xs">${c[2]}</h3>
                  <p class="text-[11px] text-[var(--muted)] mt-1">${c[3]}</p>
                </div>
              </div>
            `).join('')}
          </div>
        `)}
      </section>

      ${ctaBand('Ready to build?', 'Have an idea? Let\'s turn it into a working product.', 'Validate with DataThick. Build with Inbuilt. From concept to production and beyond.', [['100+', 'Ideas Evaluated'], ['50+', 'MVPs Built'], ['30+', 'Clients Supported'], ['10+', 'Industries Served']])}
    `;

    views.validate = () => `
      <section class="hero-light">
        <div class="max-w-7xl mx-auto px-5 py-10 grid gap-8 lg:grid-cols-2 items-center">
          <div>
            ${crumb('Validate an Idea')}
            <span class="eyebrow">${ic('database', 'w-3 h-3')} Powered by DataThick</span>
            <h1 class="text-4xl md:text-5xl font-extrabold leading-tight mt-4">Validate Your Idea <span class="grad-text">Before You Build</span></h1>
            <p class="text-sm text-slate-700 mt-5 max-w-lg leading-relaxed">Use DataThick intelligence to investigate market demand, competition, customer needs, technology trends and AI opportunities. Get a data-driven report to decide if your idea should become an MVP.</p>
            <div class="flex flex-wrap gap-3 mt-6">
              ${btn('Validate My Idea', '#form')}
              ${btn('See a Sample Report', '#sample', 'light')}
            </div>
            ${tick(['Objective &amp; data-driven', 'Real market insights', 'Actionable recommendations'])}
          </div>
          <div class="grid grid-cols-3 gap-3 items-center">
            ${[['Market Analysis', 'bar-chart-3'], ['Customer Signals', 'users'], ['Technology Analysis', 'code-2']].map(x => `
              <div class="card p-3 text-xs font-semibold flex items-center gap-2">
                ${tile('blue', x[1], '!w-8 !h-8')}${x[0]}
              </div>
            `).join('')}
            <div class="card p-4 text-center bg-blue-600 !text-white col-start-2 row-start-1 row-span-3 flex flex-col items-center justify-center gap-2 !border-blue-400">
              ${ic('lightbulb', 'w-10 h-10')}
              <span class="text-sm font-bold">Idea Validation</span>
            </div>

                    <p class="text-[11px] text-[var(--muted)]">${c[3]}</p>
                  </div>
                </div>
                <ul class="text-xs space-y-2 mt-4">
                  ${checks(c[4], 'text-blue-600')}
                </ul>
              </div>
            `).join('')}
          </div>
        `)}
      </section>

      <section class="py-8">
        ${wrap(`
          <div class="flex justify-between items-end mb-5">
            <div>
              <div class="text-[11px] font-bold tracking-wider text-slate-600 uppercase">Frequently Asked Questions</div>
              <h2 class="text-3xl font-extrabold mt-1">Everything you need to know.</h2>
            </div>
            <a href="#faq" class="text-xs font-bold text-blue-600 inline-flex items-center gap-1">View all FAQs ${arrow}</a>
          </div>
          <div class="grid gap-3 md:grid-cols-2" id="faq">
            ${[['How long does it take to build an MVP?', 'Most MVPs ship in 4 – 12 weeks depending on scope and AI complexity.'], ['How much does an MVP cost?', 'MVP Starter begins from ₹2.5L, AI MVP from ₹4.5L and MVP → Scale from ₹6L.'], ['What technologies do you use?', 'We use modern web, mobile, cloud and AI stacks including LLMs, RAG and agents.'], ['Do you provide post-launch support?', 'Yes. Ongoing support and continuous improvement are available after launch.']].map(f => `
              <div class="faq card">
                <button class="w-full flex justify-between items-center p-4 text-xs font-semibold text-left" aria-expanded="false" onclick="this.parentElement.classList.toggle('open');this.setAttribute('aria-expanded',this.parentElement.classList.contains('open'))">
                  ${f[0]}
                  <span class="plus text-lg leading-none">+</span>
                </button>
                <p class="faq-a">${f[1]}</p>
              </div>
            `).join('')}
          </div>
        `)}
      </section>

      <section id="cta" class="cta-band text-white rounded-2xl mx-5 max-w-7xl xl:mx-auto my-12 p-8 md:p-10 grid gap-8 lg:grid-cols-[1.2fr_1fr] items-center">
        <div>
          <div class="text-[11px] font-bold tracking-wider uppercase text-white/70">Ready to build?</div>
          <h2 class="text-3xl font-extrabold mt-2">Let's turn your idea into a product.</h2>
          <p class="text-sm text-white/80 mt-2">Whether you're starting from scratch or looking to scale, Inbuilt AI is your partner from idea to impact.</p>
        </div>
        <div>
          <div class="flex flex-wrap gap-3">
            ${btn('Build My MVP', '#/mvp')}
            <a href="mailto:hello@inbuilt.ai" class="btn border border-white/50 text-white hover:bg-white/10">Talk to an Expert</a>
          </div>
          <ul class="flex flex-wrap gap-4 mt-4 text-[11px] text-white/80">
            ${['Free consultation', 'Expert guidance', 'No obligation'].map(x => `
              <li class="flex items-center gap-1">
                ${ic('check-circle-2', 'w-3.5 h-3.5 text-emerald-400')}${x}
              </li>
            `).join('')}
          </ul>
        </div>
      </section>
    `;

    const nav = ['Solutions|#/services', 'Services|#/services', 'Industries|#/', 'How We Work|#/mvp', 'Resources|#/validate', 'About|#/'];
    const navAlt = ['Services|#/services', 'How It Works|#/mvp', 'Solutions|#/', 'Case Studies|#/', 'About|#/', 'Resources|#/validate'];

    function chrome(route) {
      const alt = route === 'services';
      $('#brand').innerHTML = alt
        ? `<span class="flex items-center gap-2"><span class="text-2xl font-extrabold text-blue-600 leading-none">iA</span><span class="leading-none"><b class="block text-sm font-extrabold">Inbuilt AI</b><small class="text-[7px] tracking-wider text-slate-500">IDEAS. PRODUCTS. IMPACT.</small></span></span>`
        : `<span class="block leading-none"><b class="block text-xl font-extrabold tracking-tight">INBUILT</b><small class="text-[7px] tracking-[.2em] text-slate-500">AI · SOFTWARE · DATA</small></span>`;
      const items = (alt ? navAlt : nav).map(n => n.split('|'));
      const mk = (a, c) => `<a href="${a[1]}" class="nav-link ${c} ${(a[1] === '#/' + route || (a[1] === '#/services' && alt && a[0] === 'Services')) && a[1] !== '#/' ? 'active' : ''}">${a[0]}${['Solutions', 'Industries', 'Resources'].includes(a[0]) ? ic('chevron-down', 'w-3 h-3') : ''}</a>`;
      $('#nav').innerHTML = items.map(a => mk(a, '')).join('');
      $('#mobile-nav').innerHTML = items.map(a => mk(a, '')).join('');
      $('#hdr-cta').textContent = alt ? 'Build My MVP' : 'Start a Project';
      $('#hdr-cta').href = alt ? '#/mvp' : '#/validate';
      const foot = (l) => l.map(x => `<a href="${x[1]}" class="hover:text-[var(--primary)] transition">${x[0]}</a>`).join('');
      const social = `<div class="flex gap-4">${['linkedin', 'twitter', 'youtube'].map(s => `<a href="#" aria-label="${s}" class="text-slate-800 hover:text-[var(--primary)] transition">${ic(s, 'w-4 h-4')}</a>`).join('')}</div>`;
      $('#footer').innerHTML = alt
        ? wrap(`<div class="py-10 grid gap-8 md:grid-cols-[1.2fr_1fr_1fr_1fr_1.3fr]"><div><b class="text-lg"><span class="text-blue-600">iA</span> Inbuilt AI</b><p class="text-[10px] text-slate-500 mt-1 mb-4">IDEAS. PRODUCTS. IMPACT.</p>${social}</div>${[['Services', ['MVP Starter', 'AI MVP', 'MVP to Scale', 'Custom Solutions']], ['Company', ['About Us', 'Our Process', 'Case Studies', 'Careers']], ['Resources', ['Blog', 'Guides', 'FAQ', 'Docs']]].map(c => `<div><h4 class="font-bold text-xs mb-3">${c[0]}</h4><ul class="space-y-2 text-xs text-slate-600">${c[1].map(x => `<li><a href="#/services" class="hover:text-[var(--primary)]">${x}</a></li>`).join('')}</ul></div>`).join('')}<div><h4 class="font-bold text-xs mb-2">Stay updated</h4><p class="text-xs text-slate-600 mb-3">Get the latest on AI, product engineering and innovation.</p><form class="flex gap-2" onsubmit="return submitForm(event)"><input type="email" required class="field" placeholder="Enter your email" aria-label="Email"><button class="btn !bg-blue-600 text-white !px-3" aria-label="Subscribe">${arrow}</button></form></div></div><div class="border-t border-[var(--line)] py-4 flex flex-wrap justify-between gap-2 text-[11px] text-slate-500"><span>© 2026 Inbuilt AI. All rights reserved.</span><span class="flex gap-5"><a href="#" class="hover:text-[var(--primary)]">Privacy Policy</a><a href="#" class="hover:text-[var(--primary)]">Terms of Service</a><a href="#" class="hover:text-[var(--primary)]">Contact Us</a></span></div>`)
        : wrap(`<div class="py-6 flex flex-wrap items-center justify-between gap-6"><div class="flex items-center gap-6"><span class="block leading-none"><b class="block text-xl font-extrabold">INBUILT</b><small class="text-[7px] tracking-[.2em] text-slate-500">AI · SOFTWARE · DATA</small></span><p class="text-[11px] text-slate-500 leading-snug">Inbuilt is a brand of SoftwareMent Private Limited.<br>© 2026 Inbuilt. All rights reserved.</p></div><nav class="flex flex-wrap gap-6 text-[11px] text-slate-600" aria-label="Footer">${foot([['Solutions', '#/services'], ['Services', '#/services'], ['Industries', '#/'], ['Resources', '#/validate'], ['About', '#/'], ['Contact', '#cta']])}</nav>${social}</div>`);
    }

    function route() {
      const r = (location.hash.replace(/^#\/?/, '').split('?')[0]) || 'home';
      const key = views[r] ? r : 'home';
      if (['form', 'sample', 'cta', 'faq'].includes(r)) { const t = document.getElementById(r); t && t.scrollIntoView({ behavior: 'smooth' }); return; }
      $('#app').innerHTML = `<div class="view active">${views[key]()}</div>`;
      chrome(key === 'home' ? '' : key);
      $('#mobile-nav').classList.add('hidden');
      lucide.createIcons();
      window.scrollTo({ top: 0 });
    }

    function submitForm(e) {
      e.preventDefault();
      const b = e.target.querySelector('button.btn');
      const t = b.innerHTML;
      b.textContent = 'Thank you — we\'ll be in touch';
      setTimeout(() => { b.innerHTML = t; lucide.createIcons(); e.target.reset(); }, 2500);
      return false;
    }

    $('#menu-btn').addEventListener('click', () => $('#mobile-nav').classList.toggle('hidden'));
    addEventListener('hashchange', route);
    route();
  </script>
</body>
</html>
