<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inbuilt AI</title>
  <link rel="icon" type="image/png" href="./assets/images/inbuilt_ai_logo.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'] },
          colors: {
            brand: { DEFAULT: '#6C5CE7', dark: '#5545D4' },
            navy: '#0A1235',
            ink: '#0F172A',
            muted: '#5B6478',
            line: '#E7E9F5',
            soft: '#F5F4FF',
            accent: '#2563EB'
          }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/lucide@0.441.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="font-sans text-ink bg-white antialiased">

  <header class="site-header">
    <div class="max-w-7xl mx-auto px-5 h-full flex items-center justify-between gap-6">

      <a href="#/" class="brand shrink-0" aria-label="Inbuilt AI home">
        <img src="./assets/images/logo.png" alt="Inbuilt AI" class="h-9 w-auto object-contain" />
        <span class="brand-tag">AI · SOFTWARE · DATA</span>
      </a>

      <nav id="nav" class="hidden lg:flex items-center gap-8 h-full" aria-label="Primary"></nav>

      <div class="flex items-center gap-3 shrink-0">
        <button class="icon-btn" aria-label="Search" data-action="search">
          <i data-lucide="search" class="w-4 h-4"></i>
        </button>
        <a href="#/mvp" class="btn btn-primary hidden sm:inline-flex">Start a Project</a>
        <button id="menu-btn" class="icon-btn lg:hidden" aria-label="Toggle menu" aria-expanded="false">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
      </div>
    </div>

    <nav id="mobile-nav" class="hidden lg:hidden border-t border-line bg-white px-5 py-3" aria-label="Mobile"></nav>
  </header>

  <main id="app"></main>

  <footer id="footer" class="border-t border-line bg-white"></footer>

  <div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel">
      <span class="tile tone-green mx-auto"><i data-lucide="check" class="w-5 h-5"></i></span>
      <h3 id="modal-title" class="text-xl font-extrabold mt-4">Request received</h3>
      <p id="modal-text" class="text-sm text-muted mt-2 leading-relaxed"></p>
      <button class="btn btn-primary mt-6 mx-auto" data-close>Done</button>
    </div>
  </div>

  <script>

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

    const icon = (name, cls = '') => `<i data-lucide="${name}" class="${cls}"></i>`;
    const arrow = icon('arrow-right', 'w-3.5 h-3.5');

    const img = (id, w = 640) =>
      `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=${w}&q=70`;


    function button({ label, href = '#/', variant = 'primary', scroll = '', arrowIcon = true, extra = '' }) {
      const target = scroll ? `href="#/" data-scroll="${scroll}"` : `href="${href}"`;
      return `
    <a ${target} class="btn btn-${variant} ${extra}">
      ${label}${arrowIcon ? arrow : ''}
    </a>`;
    }

    function tile(tone, name, size = '') {
      return `<span class="tile tone-${tone} ${size}">${icon(name)}</span>`;
    }

    function sectionHeading({ title, subtitle = '', link = '', href = '#/' }) {
      return `
    <div class="flex flex-wrap items-end justify-between gap-x-6 gap-y-2 mb-6">
      <div class="max-w-2xl">
        <h2 class="text-2xl md:text-[28px] font-extrabold tracking-tight leading-tight">${title}</h2>
        ${subtitle ? `<p class="text-sm text-muted mt-1.5 leading-relaxed">${subtitle}</p>` : ''}
      </div>
      ${link ? `
        <a href="${href}" class="text-link shrink-0">${link}${arrow}</a>` : ''}
    </div>`;
    }

    function checkList(items, tone = 'text-emerald-500', cols = '') {
      return `
    <ul class="grid gap-2.5 text-[13px] text-slate-700 ${cols}">
      ${items.map(text => `
        <li class="flex items-start gap-2.5">
          ${icon('check-circle-2', `w-4 h-4 mt-0.5 shrink-0 ${tone}`)}
          <span class="leading-snug">${text}</span>
        </li>`).join('')}
    </ul>`;
    }

    function iconCards(items, gridClass, { link = false } = {}) {
      return `
    <div class="grid gap-4 ${gridClass}">
      ${items.map(item => `
        <article class="card card-hover p-5 flex flex-col">
          ${tile(item.tone, item.icon)}
          <h3 class="font-bold text-sm leading-snug mt-4">${item.title}</h3>
          <p class="text-xs text-muted leading-relaxed mt-1.5">${item.text}</p>
          ${link ? `<span class="text-accent mt-auto pt-4">${arrow}</span>` : ''}
        </article>`).join('')}
    </div>`;
    }

    function steps(items, gridClass) {
      return `
    <ol class="grid gap-x-6 gap-y-8 ${gridClass}">
      ${items.map((step, i) => `
        <li>
          <div class="flex items-center gap-3">
            <span class="step-num tone-${step.tone}">${String(i + 1).padStart(2, '0')}</span>
            ${i < items.length - 1 ? '<span class="step-line hidden lg:block"></span>' : ''}
          </div>
          <h3 class="font-bold text-sm mt-3">${step.title}</h3>
          <p class="text-xs text-muted leading-relaxed mt-1.5">${step.text}</p>
        </li>`).join('')}
    </ol>`;
    }

    function chips(list) {
      const tones = ['bg-pink-50 text-pink-600', 'bg-violet-50 text-violet-600', 'bg-blue-50 text-blue-600'];
      return list.map((text, i) => `<span class="chip ${tones[i % 3]}">${text}</span>`).join('');
    }

    function eyebrow(text, iconName = '') {
      return `<span class="eyebrow">${iconName ? icon(iconName, 'w-3 h-3') : ''}${text}</span>`;
    }

    function breadcrumb(current) {
      return `
    <nav class="text-xs text-slate-600 mb-5" aria-label="Breadcrumb">
      <a href="#/" class="hover:text-brand">Home</a>
      <span class="mx-2 text-slate-400">›</span>
      <span class="font-semibold text-ink">${current}</span>
    </nav>`;
    }

    function heroChecks(items, tone = 'text-emerald-500') {
      return `
    <ul class="flex flex-wrap gap-x-6 gap-y-2 mt-7 text-xs text-slate-600">
      ${items.map(text => `
        <li class="flex items-center gap-1.5">${icon('check', `w-3.5 h-3.5 ${tone}`)}${text}</li>`).join('')}
    </ul>`;
    }

    function statsRow(stats) {
      return `
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
      ${stats.map(([value, label]) => `
        <div class="glass py-4 px-2">
          <div class="text-xl font-extrabold">${value}</div>
          <div class="text-[11px] text-white/70 mt-1 leading-tight">${label}</div>
        </div>`).join('')}
    </div>`;
    }

    function ctaBand({ label, title, text, stats = null, variant = 'band-navy' }) {
      return `
    <section class="max-w-7xl mx-auto px-5 my-14">
      <div class="${variant} rounded-2xl text-white p-8 md:p-10 grid gap-8 items-center ${stats ? 'lg:grid-cols-[1.1fr_1fr]' : ''}">
        <div>
          ${eyebrow(label, 'rocket').replace('eyebrow', 'eyebrow eyebrow-dark')}
          <h2 class="text-2xl md:text-3xl font-extrabold leading-tight mt-4">${title}</h2>
          <p class="text-sm text-white/80 mt-2 leading-relaxed">${text}</p>
          <div class="flex flex-wrap gap-3 mt-6">
            ${button({ label: 'Validate an Idea', href: '#/validate' })}
            ${button({ label: 'Start a Project', href: '#/mvp', variant: 'light' })}
          </div>
        </div>
        ${stats ? statsRow(stats) : ''}
      </div>
    </section>`;
    }

    function ideaForm({ id, title, subtitle, placeholder, lastLabel, lastPlaceholder, lastOptions, submit, step = false }) {
      return `
    <form class="form-panel" data-form="${id}" novalidate>
      <div class="flex items-center justify-between">
        ${eyebrow('Get Started', 'target')}
        ${step ? '<span class="chip bg-white border border-line text-slate-600">STEP 1 OF 3</span>' : ''}
      </div>

      <h2 class="text-2xl font-extrabold mt-4">${title}</h2>
      <p class="text-sm text-muted mt-1.5 mb-6 leading-relaxed">${subtitle}</p>

      <div class="space-y-4">
        <div>
          <label class="label" for="${id}-title">Idea Title <span class="text-red-500">*</span></label>
          <input id="${id}-title" name="title" class="field" required
                 placeholder="e.g. AI tool for automating insurance claims">
          <p class="field-error" data-error="title">Please enter an idea title.</p>
        </div>

        <div>
          <label class="label" for="${id}-desc">Description <span class="text-red-500">*</span></label>
          <div class="relative">
            <textarea id="${id}-desc" name="description" rows="4" maxlength="1000" required
                      class="field resize-none pb-7" placeholder="${placeholder}"></textarea>
            <span class="absolute bottom-2.5 right-3 text-[10px] text-slate-400" data-counter>0/1000</span>
          </div>
          <p class="field-error" data-error="description">Please describe your idea.</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="label" for="${id}-industry">Target Industry</label>
            <select id="${id}-industry" name="industry" class="field">
              <option value="">Select industry</option>
              <option>Healthcare</option>
              <option>Insurance</option>
              <option>Technology &amp; SaaS</option>
              <option>Professional Services</option>
            </select>
          </div>
          <div>
            <label class="label" for="${id}-last">${lastLabel}</label>
            <select id="${id}-last" name="last" class="field">
              <option value="">${lastPlaceholder}</option>
              ${lastOptions.map(o => `<option>${o}</option>`).join('')}
            </select>
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-full mt-6 !py-3">${submit}${arrow}</button>
    </form>`;
    }

    function reportPanel() {
      const bars = ['h-5', 'h-7', 'h-9', 'h-11', 'h-14', 'h-[4.5rem]'];
      const years = ['2024', '2025', '2026', '2027', '2028', '2029'];
      const sections = [
        'Executive Summary', 'Market Analysis', 'Competitive Landscape', 'Customer Insights',
        'Technology Analysis', 'AI Opportunity', 'MVP Recommendation', 'Risks &amp; Considerations',
        'Appendix &amp; Sources'
      ];

      return `
    <div class="card p-5 md:p-6" id="sample">
      <div class="flex items-center justify-between gap-3 mb-5">
        <h3 class="font-extrabold text-lg">Sample Opportunity Report</h3>
        <span class="chip bg-violet-100 text-violet-700">AI-Powered Analysis</span>
      </div>

      <div class="grid gap-6 md:grid-cols-[150px_1fr]">
        <ul class="report-nav">
          ${sections.map((s, i) => `<li class="${i === 0 ? 'is-active' : ''}">${s}</li>`).join('')}
        </ul>

        <div>
          <div class="flex items-start justify-between gap-3">
            <div>
              <h4 class="font-bold text-sm">AI-Powered Medical Claims Automation</h4>
              <p class="text-[10px] text-slate-400 mt-0.5">Generated on Oct 1, 2026</p>
            </div>
            <span class="chip bg-emerald-100 text-emerald-700 shrink-0">High Opportunity</span>
          </div>

          <div class="grid grid-cols-3 gap-2.5 mt-4">
            ${[['$12.5B', 'Est. Market Size'], ['18%', 'CAGR (2024-2030)'], ['High', 'Opportunity Score']].map(([v, l]) => `
              <div class="border border-line rounded-lg p-2.5">
                <div class="font-extrabold text-sm">${v}</div>
                <div class="text-[10px] text-slate-500 mt-0.5">${l}</div>
              </div>`).join('')}
          </div>

          <div class="grid gap-5 sm:grid-cols-2 mt-5">
            <div>
              <div class="text-xs font-bold mb-2">Market Opportunity</div>
              <div class="flex items-end gap-2 h-[4.5rem]">
                ${bars.map(h => `<div class="bar flex-1 ${h}"></div>`).join('')}
              </div>
              <div class="flex gap-2 mt-1.5 text-[9px] text-slate-400">
                ${years.map(y => `<span class="flex-1 text-center">${y}</span>`).join('')}
              </div>
            </div>
            <p class="text-[11px] text-muted leading-relaxed self-center">
              Growing demand for automation in healthcare claims processing driven by cost
              pressure, regulatory changes and AI adoption.
            </p>
          </div>

          <div class="grid gap-5 sm:grid-cols-2 mt-5 items-center">
            <div class="flex items-center gap-3">
              <div class="donut shrink-0"></div>
              <ul class="text-[10px] text-slate-600 space-y-1">
                <li>Direct Competitors 35%</li>
                <li>Indirect Competitors 25%</li>
                <li>Emerging Startups 20%</li>
                <li>Market Gap 20%</li>
              </ul>
            </div>
            <div>
              <div class="text-xs font-bold mb-2">Key Insights</div>
              ${checkList(['Strong market demand', 'Medium competition', 'High AI leverage', 'Clear differentiation opportunity'])}
            </div>
          </div>
        </div>
      </div>
    </div>`;
    }

    /* ---------- Solutions / Industries components ---------- */

    function centeredHeading({ lead, accent, subtitle }) {
      return `
          <div class="text-center max-w-2xl mx-auto mb-10">
            <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight leading-tight">
              ${lead} <span class="text-brand">${accent}</span>
            </h2>
            <p class="text-sm text-muted leading-relaxed mt-3">${subtitle}</p>
          </div>`;
    }

    function heroStats(stats) {
      return `
          <ul class="hero-stats">
            ${stats.map(stat => `
              <li class="hero-stat">
                <span class="hero-stat-icon">${icon(stat.icon, 'w-5 h-5')}</span>
                <span class="flex flex-col">
                  <strong class="hero-stat-value">${stat.value}</strong>
                  <span class="hero-stat-label">${stat.label}</span>
                </span>
              </li>`).join('')}
          </ul>`;
    }

    function solutionCard(item) {
      return `
          <article id="${item.slug}" class="card card-hover solution-card">
            <span class="tile tile-lg tile-outline">${icon(item.icon)}</span>
            <h3 class="solution-title">${item.title}</h3>
            <p class="solution-text">${item.text}</p>
            <a href="#/mvp" class="learn-link">Learn More${arrow}</a>
          </article>`;
    }

    function industryCard(item) {
      return `
          <article id="${item.slug}" class="card card-hover industry-card">
            <div class="industry-photo">
              <div class="industry-frame">
                <img src="${img(item.photo, 600)}" alt="${item.title}" loading="lazy" onerror="this.remove()">
              </div>
              <span class="tile industry-icon">${icon(item.icon)}</span>
            </div>
            <div class="industry-body">
              <h3 class="solution-title">${item.title}</h3>
              <p class="solution-text">${item.text}</p>
              <a href="#/validate" class="learn-link">Learn More${arrow}</a>
            </div>
          </article>`;
    }

    function ctaPanel({ kicker, title, text, primary, secondary, visual }) {
      return `
          <section class="max-w-7xl mx-auto px-5 my-14">
            <div class="cta-panel">
              <div class="relative z-10">
                <p class="cta-kicker">${kicker}</p>
                <h2 class="text-3xl md:text-[34px] font-extrabold leading-tight tracking-tight mt-3">${title}</h2>
                <p class="text-sm text-white/80 leading-relaxed mt-3 max-w-md">${text}</p>
                <div class="flex flex-wrap gap-3 mt-7">
                  ${button(primary)}
                  ${button(secondary)}
                </div>
              </div>
              ${visual}
            </div>
          </section>`;
    }

    function floatPill(iconName, label, x, y, index) {
      return `
          <span class="float-pill" style="--x:${x};--y:${y};--i:${index}">
            <span class="float-pill-icon">${icon(iconName)}</span>
            ${label}
          </span>`;
    }

    function floatChip(iconName, x, y, index) {
      return `
          <span class="float-chip" style="--x:${x};--y:${y};--i:${index}">
            ${icon(iconName)}
          </span>`;
    }

    function isoStage() {
      return `
          <div class="iso-stage" aria-hidden="true">
            <span class="iso-plane" style="--w:46%;--h:50%;--x:48%;--y:2%;--o:.9"></span>
            <span class="iso-plane" style="--w:42%;--h:46%;--x:4%;--y:30%;--o:.7"></span>
            <span class="iso-plane" style="--w:40%;--h:42%;--x:46%;--y:56%;--o:.55"></span>

            <div class="iso-core">${icon('box')}</div>

            ${floatPill('workflow', 'Automate', '52%', '6%', 0)}
            ${floatPill('activity', 'Analyze', '70%', '34%', 1)}
            ${floatPill('maximize-2', 'Scale', '6%', '74%', 2)}
            ${floatPill('sparkles', 'Predict', '62%', '78%', 3)}
          </div>`;
    }

    function globeStage() {
      const chips = [
        ['shopping-cart', '22%', '8%'],
        ['heart-pulse', '68%', '2%'],
        ['clapperboard', '86%', '30%'],
        ['shield-check', '2%', '40%'],
        ['truck', '16%', '74%'],
        ['landmark', '74%', '76%']
      ];

      return `
          <div class="globe-stage" aria-hidden="true">
            <span class="globe-ring"></span>
            <div class="globe"></div>
            <span class="globe-badge">${icon('bar-chart-3')}</span>
            ${chips.map(([name, x, y], i) => floatChip(name, x, y, i)).join('')}
          </div>`;
    }

    function dashboardStage() {
      const bars = [30, 42, 36, 55, 48, 70, 84];

      return `
          <div class="visual-stage" aria-hidden="true">
            <div class="dash-panel dash-panel-back"></div>
            <div class="dash-panel">
              <div class="dash-head"><span></span><span></span><span></span></div>
              <div class="dash-bars">
                ${bars.map(h => `<span style="--h:${h}%"></span>`).join('')}
              </div>
            </div>

            <div class="iso-core" style="--x:84%;--y:62%;--s:26%">${icon('box')}</div>

            ${floatChip('workflow', '2%', '14%', 0)}
            ${floatChip('home', '76%', '2%', 1)}
          </div>`;
    }

    function laptopStage() {
      const bars = [28, 40, 34, 52, 46, 68, 82];
      const chips = [
        ['graduation-cap', '8%', '10%'],
        ['landmark', '32%', '0%'],
        ['heart-pulse', '78%', '8%'],
        ['shopping-cart', '90%', '46%'],
        ['factory', '78%', '78%'],
        ['truck', '2%', '56%']
      ];

      return `
          <div class="visual-stage" aria-hidden="true">
            <div class="laptop">
              <div class="laptop-screen">
                <div class="dash-bars">
                  ${bars.map(h => `<span style="--h:${h}%"></span>`).join('')}
                </div>
              </div>
              <div class="laptop-base"></div>
            </div>
            ${chips.map(([name, x, y], i) => floatChip(name, x, y, i)).join('')}
          </div>`;
    }

    const SOLUTION_ITEMS = [
      {
        slug: 'intelligent-automation',
        icon: 'settings',
        title: 'Intelligent Automation',
        menuText: 'Automate workflows with AI',
        text: 'Automate repetitive tasks, streamline workflows, and reduce operational costs with AI.'
      },
      {
        slug: 'data-analytics',
        icon: 'bar-chart-3',
        title: 'Data &amp; Analytics',
        menuText: 'Turn data into insights',
        text: 'Turn your data into actionable insights with advanced analytics and machine learning.'
      },
      {
        slug: 'conversational-ai',
        icon: 'message-circle',
        title: 'Conversational AI',
        menuText: 'Chat and voice experiences',
        text: 'Build intelligent chat and voice experiences for your customers and employees.'
      },
      {
        slug: 'document-intelligence',
        icon: 'file-text',
        title: 'Document Intelligence',
        menuText: 'Process unstructured data',
        text: 'Extract, understand, and process data from unstructured documents with AI.'
      },
      {
        slug: 'predictive-intelligence',
        icon: 'brain',
        title: 'Predictive Intelligence',
        menuText: 'Anticipate trends and risks',
        text: 'Anticipate trends, reduce risks, and make smarter decisions with AI models.'
      },
      {
        slug: 'ai-integration-services',
        icon: 'cloud-upload',
        title: 'AI Integration Services',
        menuText: 'Integrate AI into your systems',
        text: 'Seamlessly integrate AI into your existing systems and workflows.'
      }
    ];

    const INDUSTRY_ITEMS = [
      {
        slug: 'healthcare',
        icon: 'heart-pulse',
        title: 'Healthcare',
        menuText: 'AI for better patient care',
        text: 'Improve patient outcomes, streamline operations, and enhance care delivery with AI.',
        photo: '1576091160399-112ba8d25d1d'
      },
      {
        slug: 'finance-banking',
        icon: 'landmark',
        title: 'Finance &amp; Banking',
        menuText: 'Secure and intelligent finance',
        text: 'Detect fraud, manage risk, and deliver personalized financial services.',
        photo: '1611974789855-9c2a0a7236a3'
      },
      {
        slug: 'retail-ecommerce',
        icon: 'shopping-cart',
        title: 'Retail &amp; E-commerce',
        menuText: 'Personalized shopping experiences',
        text: 'Drive personalized experiences, optimize inventory, and boost sales.',
        photo: '1472851294608-062f824d29cc'
      },
      {
        slug: 'manufacturing',
        icon: 'factory',
        title: 'Manufacturing',
        menuText: 'Smart and efficient production',
        text: 'Enhance productivity, predict failures, and enable smart manufacturing.',
        photo: '1565793298595-6a879b1d9492'
      },
      {
        slug: 'education',
        icon: 'graduation-cap',
        title: 'Education',
        menuText: 'AI for learning and administration',
        text: 'Enable personalized learning and improve administrative efficiency.',
        photo: '1503676260728-1c00da094a0b'
      },
      {
        slug: 'government',
        icon: 'building-2',
        title: 'Government',
        menuText: 'Transparent and efficient services',
        text: 'Improve citizen services, ensure compliance, and drive transparency.',
        photo: '1555848962-6e79363ec58f'
      },
      {
        slug: 'media-entertainment',
        icon: 'clapperboard',
        title: 'Media &amp; Entertainment',

    function navLink(item) {
      return `
    <a href="${item.href}" class="nav-link" data-key="${item.key || ''}">
      <span class="nav-label">${item.label}</span>
    </a>`;
    }

    function navDropdown(item) {
      const menu = MENUS[item.menu];

      const entries = [
        { ...menu.overview, href: menu.base },
        ...menu.items.map(entry => ({
          icon: entry.icon,
          title: entry.title,
          text: entry.menuText,
          href: `${menu.base}/${entry.slug}`
        }))
      ];

      return `
    <div class="nav-item" data-menu="${item.menu}">
      <button type="button"
              class="nav-link nav-trigger"
              data-key="${item.key}"
              aria-haspopup="true"
              aria-expanded="false"
              aria-controls="menu-${item.menu}">
        <span class="nav-label">${item.label}</span>
        ${icon('chevron-down', 'nav-chevron')}
      </button>

      <div class="dropdown" id="menu-${item.menu}">
        <div class="dropdown-panel">
          ${entries.map(entry => `
            <a href="${entry.href}" class="dropdown-item">
              <span class="tile tile-sm tone-violet">${icon(entry.icon)}</span>
              <span class="dropdown-copy">
                <span class="dropdown-title">${entry.title}</span>
                <span class="dropdown-text">${entry.text}</span>
              </span>
              ${icon('chevron-right', 'dropdown-arrow')}
            </a>`).join('')}
        </div>
      </div>
    </div>`;
    }

    function mobileLink(item) {
      return `<a href="${item.href}" class="mobile-link" data-key="${item.key || ''}">${item.label}</a>`;
    }

    function mobileGroup(item) {
      const menu = MENUS[item.menu];

      return `
    <details class="mobile-group">
      <summary class="mobile-link" data-key="${item.key}">
        <span>${item.label}</span>
        ${icon('chevron-down', 'mobile-chevron')}
      </summary>
      <div class="mobile-sub">
        <a href="${menu.base}" class="mobile-sublink">${menu.overview.title}</a>
        ${menu.items.map(entry => `
          <a href="${menu.base}/${entry.slug}" class="mobile-sublink">${entry.title}</a>`).join('')}
      </div>
    </details>`;
    }

    function renderNav() {
      $('#nav').innerHTML = NAV
        .map(item => item.menu ? navDropdown(item) : navLink(item))
        .join('');

      $('#mobile-nav').innerHTML = `
    <div class="flex flex-col py-1">
      ${NAV.map(item => item.menu ? mobileGroup(item) : mobileLink(item)).join('')}
    </div>`;
    }

    function renderFooter() {
      const links = [['Solutions', '#/services'], ['Services', '#/services'], ['Industries', '#/'], ['Resources', '#/validate'], ['About', '#/'], ['Contact', '#/services']];

      $('#footer').innerHTML = `
    <div class="max-w-7xl mx-auto px-5 py-8 flex flex-wrap items-center justify-between gap-x-10 gap-y-6">
      <div class="flex items-center gap-6">
        <a href="#/" class="brand" aria-label="Inbuilt AI home">
          <img src="./assets/images/logo.png" alt="Inbuilt AI" class="h-9 w-auto object-contain" />
          <span class="brand-tag">AI · SOFTWARE · DATA</span>
        </a>
        <p class="text-[11px] text-slate-500 leading-relaxed">
          Inbuilt.ai is a brand of SoftwareMent Private Limited.<br>
          © 2026   Inbuilt.ai   All rights reserved.
        </p>
      </div>

      <nav class="flex flex-wrap gap-x-7 gap-y-2 text-xs text-slate-600" aria-label="Footer">
        ${links.map(([label, href]) => `<a href="${href}" class="hover:text-brand transition-colors">${label}</a>`).join('')}
      </nav>

      <div class="flex gap-4">
        ${[['linkedin', 'LinkedIn'], ['twitter', 'X'], ['youtube', 'YouTube']].map(([n, l]) => `
          <a href="#/" aria-label="${l}" class="text-slate-800 hover:text-brand transition-colors">${icon(n, 'w-4 h-4')}</a>`).join('')}
      </div>
    </div>`;
    }

    function setActiveNav(route) {
      const currentHash = location.hash || '#/';
      $$('.nav-link, .mobile-link').forEach(a => {
        const keyMatch = a.dataset.key && a.dataset.key === route;
        const hrefMatch = a.getAttribute('href') === currentHash;
        const active = keyMatch || hrefMatch;

        a.classList.toggle('is-active', Boolean(active));
        active ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current');
      });
    }


    let activeRoute = null;

    function parseHash() {
      const [path] = location.hash.replace(/^#\/?/, '').split('?');
      const [name = '', sub = ''] = path.split('/');
      const route = name || 'home';

      return { route: views[route] ? route : 'home', sub };
    }

    function render() {
      const { route, sub } = parseHash();
      const changed = route !== activeRoute;

      if (changed) {
        activeRoute = route;
        $('#app').innerHTML = `<div class="view">${views[route]()}</div>`;
        setActiveNav(route);
        lucide.createIcons();
        window.scrollTo({ top: 0, behavior: 'instant' });
      }

      closeMobileNav();
      closeAllMenus();

      if (sub) {
        requestAnimationFrame(() => scrollToId(sub));
      } else if (!changed) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function scrollToId(id) {
      const el = document.getElementById(id);
      if (!el) return;
      const offset = $('.site-header').offsetHeight + 16;
      window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - offset, behavior: 'smooth' });
    }

    function closeMobileNav() {
      $('#mobile-nav').classList.add('hidden');
      $('#menu-btn').setAttribute('aria-expanded', 'false');
    }


    function openModal(message) {
      $('#modal-text').textContent = message;
      $('#modal').hidden = false;
      document.body.classList.add('modal-open');
      $('#modal .btn').focus();
    }

    function closeModal() {
      $('#modal').hidden = true;
      document.body.classList.remove('modal-open');
    }

    function validateForm(form) {
      let valid = true;
      ['title', 'description'].forEach(name => {
        const field = form.elements[name];
        const empty = !field.value.trim();
        field.classList.toggle('is-invalid', empty);
        $(`[data-error="${name}"]`, form).classList.toggle('is-visible', empty);
        if (empty) valid = false;
      });
      return valid;
    }

    document.addEventListener('click', event => {
      const target = event.target;

      const scroller = target.closest('[data-scroll]');
      if (scroller) {
        event.preventDefault();
        scrollToId(scroller.dataset.scroll);
        return;
      }

      const idea = target.closest('[data-fill]');
      if (idea) {
        const form = $('[data-form="validate"]');
        form.elements.title.value = idea.dataset.fill;
        form.elements.title.dispatchEvent(new Event('input', { bubbles: true }));
        scrollToId('validate-form');
        form.elements.description.focus({ preventScroll: true });
        return;
      }

      const faq = target.closest('.faq-q');
      if (faq) {
        const item = faq.parentElement;
        const open = item.classList.toggle('open');
        faq.setAttribute('aria-expanded', open);
        return;
      }

      if (target.closest('[data-action="toggle-faqs"]')) {
        const items = $$('.faq');
        const openAll = items.some(i => !i.classList.contains('open'));
        items.forEach(i => {
          i.classList.toggle('open', openAll);
          $('.faq-q', i).setAttribute('aria-expanded', openAll);
        });
        return;
      }

      if (target.closest('[data-action="search"]')) {
        openModal('Site search is coming soon. For now, use the navigation to explore Inbuilt AI.');
        return;
      }

      if (target.closest('[data-close]')) closeModal();
    });

    document.addEventListener('input', event => {
      const field = event.target;
      if (field.matches('[data-form] textarea')) {
        $('[data-counter]', field.parentElement).textContent = `${field.value.length}/1000`;
      }
      if (field.matches('[data-form] .field')) {
        field.classList.remove('is-invalid');
        const error = $(`[data-error="${field.name}"]`, field.form);
        if (error) error.classList.remove('is-visible');
      }
    });

    document.addEventListener('submit', event => {
      const form = event.target.closest('[data-form]');
      if (!form) return;
      event.preventDefault();
      if (!validateForm(form)) return;

      const button = $('button[type="submit"]', form);
      const original = button.innerHTML;
      const title = form.elements.title.value.trim();
      button.disabled = true;
      button.textContent = 'Submitting…';

      setTimeout(() => {
        button.disabled = false;
        button.innerHTML = original;
        lucide.createIcons();
        form.reset();
        $('[data-counter]', form).textContent = '0/1000';
        openModal(`Thanks — we've received "${title}". Our team will get back to you within one business day.`);
      }, 700);
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !$('#modal').hidden) closeModal();
    });

    /* ---------- Navigation dropdowns ---------- */

    const hoverMenus = window.matchMedia('(hover: hover)');
    let menuTimer;

    function openMenu(item) {
      clearTimeout(menuTimer);
      closeAllMenus(item);
      item.classList.add('is-open');
      $('.nav-trigger', item).setAttribute('aria-expanded', 'true');
    }

    function closeMenu(item) {
      item.classList.remove('is-open');
      $('.nav-trigger', item).setAttribute('aria-expanded', 'false');
    }

    function closeAllMenus(except = null) {
      $$('.nav-item.is-open').forEach(item => {
        if (item !== except) closeMenu(item);
      });
    }

    function bindNavMenus() {
      $$('.nav-item').forEach(item => {
        item.addEventListener('mouseenter', () => {
          if (hoverMenus.matches) openMenu(item);
        });

        item.addEventListener('mouseleave', () => {
          if (!hoverMenus.matches) return;
          menuTimer = setTimeout(() => closeMenu(item), 120);
        });

        item.addEventListener('focusout', event => {
          if (!item.contains(event.relatedTarget)) closeMenu(item);
        });
      });
    }

    document.addEventListener('click', event => {
      const trigger = event.target.closest('.nav-trigger');

      if (trigger) {
        const item = trigger.closest('.nav-item');
        const isMouseClick = event.detail > 0;

        if (isMouseClick && hoverMenus.matches) {
          location.hash = MENUS[item.dataset.menu].base;
          closeAllMenus();
        } else {
          item.classList.contains('is-open') ? closeMenu(item) : openMenu(item);
        }
        return;
      }

      if (event.target.closest('.dropdown-item')) {
        closeAllMenus();
        return;
      }

      if (!event.target.closest('.nav-item')) closeAllMenus();
      if (event.target.closest('#mobile-nav a')) closeMobileNav();
    });

    document.addEventListener('keydown', event => {
      const openItem = $('.nav-item.is-open');

      if (event.key === 'Escape' && openItem) {
        closeMenu(openItem);
        $('.nav-trigger', openItem).focus();
        return;
      }

      const item = event.target.closest('.nav-item');
      if (!item || !['ArrowDown', 'ArrowUp'].includes(event.key)) return;

      event.preventDefault();
      openMenu(item);

      const links = $$('.dropdown-item', item);
      const index = links.indexOf(document.activeElement);
      const down = event.key === 'ArrowDown';
      const next = index === -1 ? (down ? 0 : links.length - 1) : index + (down ? 1 : -1);

      links[(next + links.length) % links.length].focus();
    });

    $('#menu-btn').addEventListener('click', () => {
      const nav = $('#mobile-nav');
      const hidden = nav.classList.toggle('hidden');
      $('#menu-btn').setAttribute('aria-expanded', String(!hidden));
    });

    window.addEventListener('hashchange', render);

    renderNav();
    bindNavMenus();
    renderFooter();
    render();
  </script>
